    <!-- header -->

    <header class="dashboard-header">
    <div class="header-content">
    <h2 id="headerTitle">Dashboard</h2>
    <button onclick="logout()">Logout</button>
    </div>
    <hr class="line">
  </header>

  <!-- main section -->
  <main class="dashbord-main">

    <div id="dashboardSection">Welcome 👋</div>

    <div id="aiSection" style="display: none;">
    <div class="chat-container">
      <div id="chatBox" class="chat-box"></div>

      <div class="input-area">

        <input type="text" id="userInput" placeholder="Ask me anything about career paths, programs, or training..." style="font-size: 2rem;" />

        <button onclick="sendMessage()"><img src="/img/send.png" alt="" height="30" width="40"></button>
      </div>
    </div>
    </div>

    <div id="programSection" style="display:none;">
      <h3>Programs</h3>
    </div>

    <div id="careerSection" style="display:none;">
      <h3>Career Guide</h3>
    </div>

  </div>
  <script src="script.js"></script>
